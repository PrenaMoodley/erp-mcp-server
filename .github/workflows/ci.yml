name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

      - name: Tests on SQLite
        run: pytest -q

      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp

      - name: Hand-written schema.sql and read-only role apply cleanly
        run: |
          psql -h localhost -U erp -d postgres -c "CREATE DATABASE schema_check"
          psql -h localhost -U erp -d schema_check -v ON_ERROR_STOP=1 -f sql/schema.sql
          sed 's/DATABASE erp /DATABASE schema_check /' sql/readonly_role.sql \
            | psql -h localhost -U erp -d schema_check -v ON_ERROR_STOP=1
          # The read-only role must not be able to write.
          if PGPASSWORD=change-me psql -h localhost -U erp_mcp_readonly -d schema_check -v ON_ERROR_STOP=1 \
               -c "INSERT INTO customers VALUES ('X1','x','x')"; then
            echo "read-only role was able to write" && exit 1
          fi
